
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>InternMatch - Find Internships</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>

<body class="bg-light">

    <div class="container mt-5">

        <div class="card shadow p-4 mx-auto" style="max-width: 650px;">

            <h1 class="text-center mb-3">InternMatch</h1>

            <p class="text-center text-muted">
                Find internships that match your skills and interests!
            </p>

            <form action="/" method="POST">

                <div class="mb-3">
                    <label class="form-label">Your Skills</label>
                    <input
                        type="text"
                        class="form-control"
                        name="skills"
                        placeholder="Python, SQL, HTML"
                        required>
                    <small class="text-muted">
                        Separate multiple skills with commas.
                    </small>
                </div>
